spring:
  security:
    oauth2:
      client:
        registration:
          qq:
            client-id: YOUR_CLIENT_ID
            client-secret: YOUR_CLIENT_SECRET
            redirect-uri: "{baseUrl}/oauth2/callback/qq"
            authorization-grant-type: authorization_code
            scope: read_user_info
            client-name: QQ
        provider:
          qq:
            authorization-uri: https://graph.qq.com/oauth2.0/authorize
            token-uri: https://graph.qq.com/oauth2.0/token
            user-info-uri: https://graph.qq.com/user/get_user_info
            user-name-attribute: openid
  datasource:
    url: jdbc:mysql://localhost:3306/userdb
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
  data:
    mongodb:
      uri: mongodb://localhost:27017/userdb
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092


jwt:
  secret: your-secret-key
  expiration: 86400000 # 24 hours
